<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vienovo Operations Dashboard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f1419;
            color: #e0e0e0;
        }

        .header {
            background: linear-gradient(135deg, #1a1f2e 0%, #0f1419 100%);
            padding: 20px 40px;
            border-bottom: 1px solid #2a3f5f;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-left { display: flex; gap: 30px; align-items: center; }
        .logo { font-size: 20px; font-weight: 700; color: #00d4ff; }
        .user-info { font-size: 12px; color: #888; }
        .user-name { color: #e0e0e0; font-weight: 600; }

        .header-right {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        select, button {
            padding: 8px 15px;
            background: #1a2332;
            color: #e0e0e0;
            border: 1px solid #2a3f5f;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }

        button {
            background: #0066cc;
            border-color: #0066cc;
            font-weight: 600;
        }

        button:hover { background: #0052a3; }

        .content {
            padding: 30px 40px;
        }

        .status-msg {
            padding: 15px 20px;
            background: #1a3a52;
            border-left: 3px solid #00d4ff;
            border-radius: 4px;
            margin-bottom: 25px;
            font-size: 13px;
        }

        .status-loading { background: #1a3a52; border-left-color: #ffc107; }
        .status-success { background: #1a3a1a; border-left-color: #00dd00; }
        .status-error { background: #3a1a1a; border-left-color: #ff4444; }

        .plant-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .plant-card {
            background: linear-gradient(135deg, #1a2332 0%, #0f1419 100%);
            border: 1px solid #2a3f5f;
            border-radius: 8px;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        .plant-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, #00d4ff, #0066cc, #00d4ff);
        }

        .plant-name {
            font-size: 14px;
            font-weight: 700;
            color: #00d4ff;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .plant-output {
            font-size: 28px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 5px;
        }

        .plant-output-unit {
            font-size: 11px;
            color: #888;
            text-transform: uppercase;
        }

        .plant-metrics {
            font-size: 11px;
            color: #888;
            margin-top: 15px;
            border-top: 1px solid #2a3f5f;
            padding-top: 15px;
        }

        .metric-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .metric-label { color: #666; }
        .metric-value { color: #00d4ff; font-weight: 600; }

        .section-title {
            font-size: 16px;
            font-weight: 700;
            color: #e0e0e0;
            margin: 40px 0 20px 0;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 2px solid #0066cc;
            padding-bottom: 10px;
        }

        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .kpi-box {
            background: linear-gradient(135deg, #1a2332 0%, #0f1419 100%);
            border: 1px solid #2a3f5f;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
        }

        .kpi-label {
            font-size: 11px;
            color: #888;
            text-transform: uppercase;
            margin-bottom: 10px;
            letter-spacing: 0.5px;
        }

        .kpi-value {
            font-size: 28px;
            font-weight: 700;
            color: #00d4ff;
            margin-bottom: 5px;
        }

        .kpi-unit {
            font-size: 11px;
            color: #666;
        }

        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .chart-box {
            background: linear-gradient(135deg, #1a2332 0%, #0f1419 100%);
            border: 1px solid #2a3f5f;
            border-radius: 8px;
            padding: 20px;
        }

        .chart-title {
            font-size: 13px;
            font-weight: 700;
            color: #e0e0e0;
            text-transform: uppercase;
            margin-bottom: 15px;
            letter-spacing: 0.5px;
        }

        .table-container {
            background: linear-gradient(135deg, #1a2332 0%, #0f1419 100%);
            border: 1px solid #2a3f5f;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 30px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }

        th {
            background: #0f1419;
            padding: 12px 15px;
            text-align: left;
            font-weight: 700;
            color: #00d4ff;
            border-bottom: 1px solid #2a3f5f;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        td {
            padding: 12px 15px;
            border-bottom: 1px solid #2a3f5f;
            color: #e0e0e0;
        }

        tbody tr:hover {
            background: #1a2332;
        }

        .text-right { text-align: right; }
    </style>
</head>
<body>
    <!-- HEADER -->
    <div class="header">
        <div class="header-left">
            <div class="logo">VIENOVO OPS</div>
            <div class="user-info">
                <div class="user-name">Marvin Rosario</div>
                <div>Operations Manager</div>
            </div>
        </div>
        <div class="header-right">
            <select id="weekSelector">
                <option value="">Select Week</option>
            </select>
            <button onclick="loadData()">⟳ Refresh</button>
        </div>
    </div>

    <!-- CONTENT -->
    <div class="content">
        <div id="statusMsg"></div>

        <!-- NATIONAL SCORECARD -->
        <div class="section-title">National Scorecard</div>
        <div class="kpi-grid">
            <div class="kpi-box">
                <div class="kpi-label">Total Output</div>
                <div class="kpi-value" id="national-output">—</div>
                <div class="kpi-unit">MT</div>
            </div>
            <div class="kpi-box">
                <div class="kpi-label">Avg Capacity</div>
                <div class="kpi-value" id="national-capacity">—</div>
                <div class="kpi-unit">%</div>
            </div>
            <div class="kpi-box">
                <div class="kpi-label">Quality Score</div>
                <div class="kpi-value" id="national-quality">—</div>
                <div class="kpi-unit">%</div>
            </div>
            <div class="kpi-box">
                <div class="kpi-label">OEE</div>
                <div class="kpi-value" id="national-oee">—</div>
                <div class="kpi-unit">%</div>
            </div>
        </div>

        <!-- PLANT CARDS -->
        <div class="section-title">Plant Performance</div>
        <div class="plant-cards" id="plantCards"></div>

        <!-- OEE CIRCULAR CHARTS -->
        <div class="section-title">OEE Breakdown</div>
        <div class="charts-grid">
            <div class="chart-box">
                <div class="chart-title">Overall OEE</div>
                <canvas id="oeeChart"></canvas>
            </div>
            <div class="chart-box">
                <div class="chart-title">Performance</div>
                <canvas id="performanceChart"></canvas>
            </div>
            <div class="chart-box">
                <div class="chart-title">Quality</div>
                <canvas id="qualityChart"></canvas>
            </div>
            <div class="chart-box">
                <div class="chart-title">Availability</div>
                <canvas id="availabilityChart"></canvas>
            </div>
        </div>

        <!-- DOWNTIME TABLE -->
        <div class="section-title">Downtime Details</div>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Plant</th>
                        <th>Date</th>
                        <th>Issue</th>
                        <th class="text-right">Duration (hrs)</th>
                    </tr>
                </thead>
                <tbody id="downtimeTable">
                    <tr><td colspan="4" style="text-align:center">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let dashData = {};
        let charts = {};

        function showStatus(msg, type) {
            const el = document.getElementById('statusMsg');
            el.className = `status-msg status-${type}`;
            el.textContent = msg;
        }

        async function loadData() {
            showStatus('⟳ Loading data...', 'loading');
            try {
                console.log('Fetching from /api/data...');
                const response = await fetch('/api/data');
                console.log('Response status:', response.status);

                if (!response.ok) {
                    const errorText = await response.text();
                    console.error('Error response:', errorText);
                    throw new Error(`API Error ${response.status}: ${errorText}`);
                }

                dashData = await response.json();
                console.log('Data loaded:', dashData);
                showStatus('✓ Data loaded successfully', 'success');
                renderDashboard();
            } catch (error) {
                console.error('Full error:', error);
                showStatus(`❌ Error: ${error.message}`, 'error');
            }
        }

        function createCircleChart(canvasId, value, maxValue = 100) {
            const ctx = document.getElementById(canvasId).getContext('2d');

            if (charts[canvasId]) {
                charts[canvasId].destroy();
            }

            const percentage = Math.min(value, maxValue);
            const color = percentage >= 80 ? '#00dd00' : percentage >= 60 ? '#ffaa00' : '#ff4444';

            charts[canvasId] = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    datasets: [{
                        data: [percentage, maxValue - percentage],
                        backgroundColor: [color, '#2a3f5f'],
                        borderColor: '#0f1419',
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: {
                        legend: { display: false },
                        tooltip: { enabled: false }
                    },
                    cutout: '75%'
                },
                plugins: [{
                    id: 'textCenter',
                    beforeDatasetsDraw(chart) {
                        const { width, height, ctx } = chart;
                        ctx.restore();
                        const fontSize = (height / 200).toFixed(2);
                        ctx.font = `bold ${fontSize * 20}px sans-serif`;
                        ctx.textBaseline = 'middle';
                        ctx.fillStyle = '#00d4ff';
                        const text = `${percentage.toFixed(1)}%`;
                        const textX = Math.round((width - ctx.measureText(text).width) / 2);
                        const textY = height / 2;
                        ctx.fillText(text, textX, textY);
                        ctx.save();
                    }
                }]
            });
        }

        function renderDashboard() {
            const { plantData, oee, downtime } = dashData;

            // National metrics
            let totalOutput = 0, totalCapacity = 0, totalQuality = 0, plantCount = 0;

            Object.values(plantData).forEach(plant => {
                totalOutput += plant.output;
                totalCapacity += plant.capacity;
                totalQuality += plant.quality;
                plantCount++;
            });

            document.getElementById('national-output').textContent = totalOutput.toFixed(0);
            document.getElementById('national-capacity').textContent = (totalCapacity / plantCount).toFixed(0);
            document.getElementById('national-quality').textContent = (totalQuality / plantCount).toFixed(1);
            document.getElementById('national-oee').textContent = oee.total.toFixed(1);

            // Plant cards
            const plants = ['AC', 'PFMIS', 'HOREB', 'ARGAO', 'BUKID', 'CCPC', 'SOUTH'];
            let html = '';

            plants.forEach(plant => {
                const data = plantData[plant];
                html += `
                    <div class="plant-card">
                        <div class="plant-name">● ${plant}</div>
                        <div class="plant-output">${data.output.toFixed(1)}</div>
                        <div class="plant-output-unit">MT / 100%</div>
                        <div class="plant-metrics">
                            <div class="metric-row">
                                <span class="metric-label">Capacity</span>
                                <span class="metric-value">${data.capacity.toFixed(0)}%</span>
                            </div>
                            <div class="metric-row">
                                <span class="metric-label">Quality</span>
                                <span class="metric-value">${data.quality.toFixed(1)}%</span>
                            </div>
                            <div class="metric-row">
                                <span class="metric-label">kWh/ton</span>
                                <span class="metric-value">${data.kwhTon.toFixed(2)}</span>
                            </div>
                            <div class="metric-row">
                                <span class="metric-label">L/ton</span>
                                <span class="metric-value">${data.fuelTon.toFixed(2)}</span>
                            </div>
                        </div>
                    </div>
                `;
            });

            document.getElementById('plantCards').innerHTML = html;

            // OEE charts
            createCircleChart('oeeChart', oee.total);
            createCircleChart('performanceChart', oee.performance);
            createCircleChart('qualityChart', oee.quality);
            createCircleChart('availabilityChart', oee.availability);

            // Downtime table
            const dtRows = downtime.slice(-20).reverse().map(d =>
                `<tr><td>${d.plant}</td><td>${d.date}</td><td>${d.issue}</td><td class="text-right">${d.duration.toFixed(1)}</td></tr>`
            ).join('');
            document.getElementById('downtimeTable').innerHTML = dtRows || '<tr><td colspan="4">No data</td></tr>';
        }

        window.addEventListener('load', loadData);
        setInterval(loadData, 60000);
    </script>
</body>
</html>
